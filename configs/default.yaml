# ============================================================================
# AI Monitor — 默认配置(所有键的基线值)
#
# 配置级联(由低到高,后者覆盖前者):
#   configs/default.yaml  →  configs/profiles/{profile}.yaml  →  数据库 cameras.config(JSONB)  →  .env / 环境变量
#
# 设计原则: 所有可调参数集中于此,代码中不允许出现硬编码数值。
#
# 注意: 服务级配置(数据库连接/主机端口/CORS 白名单/清理计划)不在此文件,
# 由 backend pydantic Settings 经 .env / 环境变量(AIM_DATABASE_URL、
# AIM_CORS_ORIGINS、AIM_EVENT_RETENTION_DAYS 等)提供。
# ============================================================================

# ── 视频流(WebSocket → 前端)────────────────────────────────
stream:
  max_height: 480          # 推流前缩放最大高度(px)
  jpeg_quality: 70         # JPEG 质量 [1,100]
  push_fps: 20             # 推流帧率上限(编码在独立线程,不阻塞事件循环)

# ── InsightFace 视觉内核(推理默认 GPU)───────────────────────
vision:
  model_pack: "buffalo_l"          # insightface 模型包(buffalo_l 高精度 / buffalo_s 轻量 / buffalo_sc)。
                                  # ⚠ 底库 embedding 与模型包强绑定:已有特征均为 buffalo_l 提取,
                                  # 切换其他 pack 会导致跨模型余弦相似度跌破阈值、识别全部失效,
                                  # 必须重新注册全部人脸。buffalo_l 超 GitHub 单文件限制不入 git,
                                  # 新环境 clone 后需自行下载解压到 models/buffalo_l/(见 .gitignore)。
  models_root: "models"            # 模型根目录(相对项目根;也支持绝对路径或 ~/.insightface)
  device: "cuda"                   # cuda(默认,全部推理走 GPU)/ cpu / auto(自动检测)
  providers_cuda: ["CUDAExecutionProvider", "CPUExecutionProvider"]
  providers_cpu: ["CPUExecutionProvider"]
  det_size: [640, 640]             # SCRFD 检测输入尺寸(或 [[128,128],[640,640]] 多尺度)
  det_thresh: 0.5                  # 检测置信度阈值
  max_faces: 0                     # 单帧最多检测人脸数(0=不限)
  det_interval: 2                  # 每 N 帧执行一次检测

  track:                           # ByteTrack 多目标跟踪(卡尔曼 + 两阶段关联)
    track_thresh: 0.5              # 高置信度检测阈值(进入第一轮关联)
    low_thresh: 0.1                # 低置信度检测下限(低于丢弃)
    match_thresh: 0.8              # 第一轮 IoU 关联阈值(1-IoU 成本上限)
    track_buffer: 30               # lost 保留帧数(按 frame_rate 缩放)
    min_hits: 3                    # 新轨迹连续命中确认帧数
    frame_rate: 30                 # 用于 lost 保留时长缩放
    max_tracks: 30                 # 最大并行 track 数

  recognition:                     # 识别调度(ArcFace 512-d 余弦相似度)
    threshold: 0.40                # 匹配阈值 [0,1]
    cooldown_frames: 300           # 未识别 track 重试冷却(帧)
    recognized_cooldown_frames: 600  # 已识别 track 重验证冷却(帧)
    failed_backoff_frames: 90      # 每次识别失败额外冷却(帧)
    max_attempts: 20               # 每 track 最大失败次数(0=不限)
    queue_size: 8                  # 识别 worker 队列上限
    log_to_db: true                # 识别结果写入 recognition_logs
    event_to_db: true              # 识别事件写入 events 表
    quality:
      min_det_score: 0.60          # 实时识别检测置信度下限
      min_face_size: 80            # 人脸框短边(px)下限
    temporal:
      min_valid_samples: 3         # 同一轨迹/身份达到多少有效样本后确认
      max_samples_per_track: 8     # 同一轨迹最多保存的有效样本总数
      top_k: 3                      # 稳定分数使用最高的 K 条样本

  registration:                    # 注册/追加特征质量筛选(仅注册路径生效,避免低质量 embedding 入库)
    min_face_size: 48              # 人脸框最短边(px),低于此拒绝
    min_det_score: 0.5             # 注册时检测置信度下限(0.5=与实时 det_thresh 一致;不同检测器标定不同,可调高收紧)
    video:                           # 摄像头/视频帧注册(实时动作引导+批量分析入库)
      sample_interval_ms: 500          # 实时分析节流间隔(前端参考)
      max_analyze_frames: 30           # 单次 analyze 帧数上限
      min_submit_frames: 3             # 提交下限
      max_submit_frames: 8             # 提交上限
      min_blur_variance: 55.0          # Laplacian 清晰度下限
      max_yaw_ratio: 0.20              # 正脸 yaw 上限(超此为侧脸)
      max_pitch_ratio: 0.28            # 正脸 pitch 上限
      duplicate_similarity: 0.94       # 候选帧 embedding 余弦去重阈值

tasks:
  face_recognition:
    enabled: true
    class_path: "app.tasks.builtin.face_recognition_task.FaceRecognitionTask"
  # 跌倒检测(姿态项目对外 Task)。完整基线配置唯一存放在此处;
  # desktop/balanced/edge_minimal 只允许覆盖 enabled/mode/target_fps。
  fall_detection:
    enabled: true
    class_path: "ai_monitor_pose.task.FallDetectionTask"
    interval: 1
    mode: "shadow"
    runtime_key: "pose-cuda-0"

    worker:
      python: "pose_plugin/.venv-worker/Scripts/python.exe"
      module: "ai_monitor_pose.worker"
      pipe_prefix: "ai-monitor-fall-v1"
      startup_timeout_s: 45
      heartbeat_interval_s: 1
      heartbeat_timeout_s: 3
      inference_timeout_s: 5
      graceful_shutdown_timeout_s: 5
      zero_lease_worker_drain_timeout_s: 5
      idle_retention_s: 60
      restart_max_attempts: 3
      restart_window_s: 600
      restart_backoff_s: [1, 2, 4]

    gpu:
      required: true
      device: "cuda:0"
      expected_device_name_regex: "(?i)RTX 4060"
      precision: "fp16"
      allow_cpu_fallback: false
      max_gpu_memory_mb: 3072
      max_vram_fraction: 0.80
      minimum_free_vram_mb: 1024

    model:
      path: "pose_plugin/models/yolov8n-pose.pt"
      sha256_file: "pose_plugin/models/yolov8n-pose.pt.sha256"
      allow_download: false
      imgsz: 640
      confidence: 0.35
      iou: 0.45
      max_detections: 50

    runtime:
      max_cameras: 4
      requested_max_total_fps: 32
      capacity_manifest_path: "pose_plugin/models/capacity-cuda0.json"
      capacity_manifest_sha256: "f30eb17d2b70f50b6e55de3cda71e4a7a1df14cfbd55822a3da04bdef8268ac8"  # 阶段9 正式300s基准 manifest 摘要(含 driver_version)
      capacity_headroom_ratio: 0.75
      frame_slots_per_camera: 2
      max_frame_width: 1920
      max_frame_height: 1080
      max_result_age_ms: 1500
      overlay_ttl_ms: 1200
      transition_queue_capacity_per_camera: 64
      transition_queue_resume_ratio: 0.50
      worker_journal_path: "pose_plugin/var/worker-transition-journal.sqlite3"
      worker_journal_pending_capacity: 10000
      event_spool_path: "pose_plugin/var/fall-event-spool.sqlite3"
      event_spool_pending_capacity: 10000
      delivered_retention_hours: 24
      delivered_retention_rows: 1000

    delivery:
      ingress_queue_capacity: 1024
      outbox_pending_capacity: 10000
      outbox_resume_ratio: 0.50
      outbox_delivered_retention_hours: 24
      outbox_delivered_retention_rows: 10000

    scheduler:
      target_fps: 8
      latest_only: true
      batch_size: 1
      fair_policy: "service_debt_round_robin"
      not_ready_retry_ms: 500

    tracker:
      high_confidence: 0.35
      low_confidence: 0.15
      match_iou_threshold: 0.50
      max_normalized_keypoint_distance: 0.35
      min_confirm_duration_s: 0.25
      lost_timeout_s: 1.5
      ghost_timeout_s: 3.0
      fallen_ghost_timeout_s: 5.0

    algorithm:
      required_keypoint_indices: [0, 5, 6, 11, 12, 13, 14]
      minimum_visible_required: 5
      keypoint_min_confidence: 0.30
      minimum_body_height_ratio: 0.12
      bbox_height_width_fall_max: 0.75
      torso_inclination_from_vertical_min_deg: 55.0
      hip_angle_fall_min_deg: 135.0
      head_descent_body_heights_min: 0.18
      rotation_energy_min_rad_s: 1.80
      gravity_factor_min_body_heights_s2: 1.50
      fast_rotation_energy_min_rad_s: 3.00
      fast_gravity_factor_min_body_heights_s2: 2.50
      upright_height_width_min: 1.25
      upright_torso_inclination_max_deg: 25.0
      rebound_body_heights_min: 0.12
      ema_tau_s: 0.20
      history_duration_s: 4.5
      trigger_window_s: 1.25
      trigger_ratio: 0.50
      min_trigger_duration_s: 0.50
      max_trigger_gap_s: 0.25
      min_fall_pose_duration_s: 3.50
      recovery_duration_s: 1.00
      rebound_duration_s: 0.50
      tracker_reset_gap_s: 1.50
      allow_already_down_detection: false

    cross_camera:
      enabled: false
      camera_group_id: null
      view_id: null
      max_timestamp_skew_ms: 200

# ── 摄像头默认值(数据库无配置时使用)─────────────────────────
camera_defaults:
  width: 640          # 采集分辨率(0 = 跟随源原生分辨率,由 /api/cameras/{id}/resolution 写入)
  height: 480
  max_width: 0        # 采集兜底缩放上限(0 = 不缩放)
  profile: "desktop"
