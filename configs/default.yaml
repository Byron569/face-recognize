# ============================================================================
# AI Monitor — 默认配置(所有键的基线值)
#
# 配置级联(由低到高,后者覆盖前者):
#   configs/default.yaml  →  configs/profiles/{profile}.yaml  →  数据库 cameras.config(JSONB)  →  .env / 环境变量
#
# 设计原则: 所有可调参数集中于此,代码中不允许出现硬编码数值。
# ============================================================================

# ── 后端服务 ────────────────────────────────────────────────
server:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["*"]

# ── 数据库 ──────────────────────────────────────────────────
database:
  url: "postgresql+asyncpg://postgres:123456@localhost:5432/ai_monitor"

# ── 存储路径(相对项目根)────────────────────────────────────
storage:
  avatars_dir: "face_db/avatars"

# ── 视频流(WebSocket → 前端)────────────────────────────────
stream:
  max_height: 480          # 推流前缩放最大高度(px)
  jpeg_quality: 70         # JPEG 质量 [1,100]
  push_fps: 20             # 推流帧率上限(编码在独立线程,不阻塞事件循环)

# ── InsightFace 视觉内核(推理默认 GPU)───────────────────────
vision:
  model_pack: "buffalo_l"          # insightface 模型包(buffalo_l 高精度 / buffalo_s 轻量 / buffalo_sc)
  models_root: "models"            # 模型根目录(相对项目根;也支持绝对路径或 ~/.insightface)
  device: "cuda"                   # cuda(默认,全部推理走 GPU)/ cpu / auto(自动检测)
  providers_cuda: ["CUDAExecutionProvider", "CPUExecutionProvider"]
  providers_cpu: ["CPUExecutionProvider"]
  det_size: [640, 640]             # SCRFD 检测输入尺寸(或 [[128,128],[640,640]] 多尺度)
  det_thresh: 0.5                  # 检测置信度阈值
  max_faces: 0                     # 单帧最多检测人脸数(0=不限)
  det_interval: 2                  # 每 N 帧执行一次检测

  track:                           # ByteTrack 多目标跟踪(卡尔曼 + 两阶段关联)
    track_thresh: 0.5              # 高置信度检测阈值(进入第一轮关联)
    low_thresh: 0.1                # 低置信度检测下限(低于丢弃)
    match_thresh: 0.8              # 第一轮 IoU 关联阈值(1-IoU 成本上限)
    track_buffer: 30               # lost 保留帧数(按 frame_rate 缩放)
    min_hits: 3                    # 新轨迹连续命中确认帧数
    frame_rate: 30                 # 用于 lost 保留时长缩放
    max_tracks: 30                 # 最大并行 track 数

  recognition:                     # 识别调度(ArcFace 512-d 余弦相似度)
    threshold: 0.40                # 匹配阈值 [0,1]
    cooldown_frames: 300           # 未识别 track 重试冷却(帧)
    recognized_cooldown_frames: 600  # 已识别 track 重验证冷却(帧)
    failed_backoff_frames: 90      # 每次识别失败额外冷却(帧)
    max_attempts: 20               # 每 track 最大失败次数(0=不限)
    queue_size: 8                  # 识别 worker 队列上限
    log_to_db: true                # 识别结果写入 recognition_logs
    event_to_db: true              # 识别事件写入 events 表
    quality:
      min_det_score: 0.60          # 实时识别检测置信度下限
      min_face_size: 80            # 人脸框短边(px)下限
    temporal:
      min_valid_samples: 3         # 同一轨迹/身份达到多少有效样本后确认
      max_samples_per_track: 8     # 同一轨迹最多保存的有效样本总数
      top_k: 3                      # 稳定分数使用最高的 K 条样本

  registration:                    # 注册/追加特征质量筛选(仅注册路径生效,避免低质量 embedding 入库)
    min_face_size: 48              # 人脸框最短边(px),低于此拒绝
    min_det_score: 0.5             # 注册时检测置信度下限(0.5=与实时 det_thresh 一致;不同检测器标定不同,可调高收紧)

# ── 可插拔任务(不写死: 启用/禁用 + 实现路径均可配置)─────────
tasks:
  face_recognition:
    enabled: true
    class_path: "app.tasks.builtin.face_recognition_task.FaceRecognitionTask"
  # 预留: 跌倒检测等扩展任务安装后,在此添加条目并设 enabled: true 即可接入
  fall_detection:
    enabled: false
    class_path: null

# ── 摄像头默认值(数据库无配置时使用)─────────────────────────
camera_defaults:
  width: 640          # 采集分辨率(0 = 跟随源原生分辨率,由 /api/cameras/{id}/resolution 写入)
  height: 480
  max_width: 0        # 采集兜底缩放上限(0 = 不缩放)
  profile: "desktop"

# ── 数据清理 ────────────────────────────────────────────────
cleanup:
  event_retention_days: 30
  cron_hour: 3
